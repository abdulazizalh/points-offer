<title>MASAR · مَسار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: wide showcase page + phone-framed interactive app. Deliberately single light theme (MASAR brand). */
:root{
  --navy:#223A5E;--deep:#355982;--medium:#4D79A8;--accent:#6E9ECC;--light:#9FC0E3;--pale:#D0E1F2;--bg:#F3F8FD;
  --white:#FFFFFF;--muted:#6B7F95;--success:#27966B;--warning:#E6A23C;--error:#D9534F;--line:#E1EAF3;--warnbg:#FDF6EA;--warnfg:#8A5B12;
  --f-ar:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;--f-en:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(34,58,94,.04),0 6px 20px rgba(34,58,94,.07);--float:0 14px 40px rgba(34,58,94,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:#E9F1F9;color:var(--navy);font-family:var(--f-ar);margin:0;-webkit-font-smoothing:antialiased}
html[lang=en] body{font-family:var(--f-en)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--navy)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--medium);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* showcase */
.wide{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#fff}
.topbar .wide{display:flex;align-items:center;justify-content:space-between;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;direction:ltr}
.brand b{font-family:var(--f-en);letter-spacing:.28em;font-size:15px;font-weight:600}
.brand small{display:block;font-family:var(--f-ar);color:var(--muted);font-size:11px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;background:#fff}
.hero{background:linear-gradient(135deg,#223A5E,#2B4A75 55%,#355982);color:#fff;overflow:hidden;position:relative}
.hero .wide{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:56px}
.hero h1{font-size:46px;line-height:1.15;margin:16px 0 4px;font-weight:600;text-wrap:balance}
.hero p{color:var(--pale);font-size:16px;line-height:1.75;max-width:520px}
.tag{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:var(--pale);border-radius:999px;padding:5px 12px;font-size:12px}
.cta{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:16px;font-weight:600;font-size:15px}
.cta.white{background:#fff;color:var(--navy);box-shadow:var(--float)}
.cta.ghost{border:1px solid rgba(255,255,255,.35);color:#fff}
.cta.navy{background:var(--navy);color:#fff}
.sec{padding-block:56px 0}
.sec h2{text-align:center;font-size:28px;margin:0;font-weight:600;text-wrap:balance}
.sec .sub{text-align:center;color:var(--muted);margin:8px auto 0;max-width:640px;line-height:1.7}
.grid{display:grid;gap:12px;margin-top:28px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.feat{padding:18px}
.feat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--medium));color:#fff}
.feat h3{font-size:15px;margin:14px 0 6px}.feat p{font-size:13px;line-height:1.65;color:var(--muted);margin:0}
.step{display:flex;gap:14px;padding:18px}
.step .n{width:38px;height:38px;flex:none;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.step h3{margin:0;font-size:15px}.step p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.part{display:flex;flex-direction:column;padding:22px;border-radius:22px;color:#fff;box-shadow:var(--float);text-align:start}
.part h3{margin:16px 0 6px;font-size:18px}.part p{margin:0;flex:1;color:var(--pale);font-size:13.5px;line-height:1.65}
.part span.b{margin-top:16px;background:#fff;color:var(--navy);border-radius:12px;height:40px;display:grid;place-items:center;font-weight:600;font-size:14px}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.links button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start;font-size:13px;font-weight:500;background:#fff}
.links button:hover{background:var(--bg)}
.foot{margin-top:56px;border-top:1px solid var(--line);background:#fff;padding-block:28px;text-align:center;font-size:12px;color:var(--muted)}
/* phone */
.stage{min-height:100%;display:flex;justify-content:center;padding-block:20px;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.phone{width:100%;max-width:440px;background:var(--bg);border-radius:34px;box-shadow:var(--float);border:1px solid var(--line);overflow:hidden;position:relative;min-height:760px;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding-bottom:84px}
.demo{background:var(--warnbg);color:var(--warnfg);font-size:11px;text-align:center;padding:6px 14px;border-bottom:1px solid rgba(230,162,60,.25)}
.hdr{display:flex;align-items:center;gap:6px;padding:12px 16px 8px;min-height:56px}
.hdr h1{font-size:18px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icb:hover{background:rgba(208,225,242,.6)}
[dir=rtl] .flip{transform:scaleX(-1)}
.nav{position:absolute;bottom:0;inset-inline:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;font-size:10.5px;font-weight:500;color:var(--muted);position:relative}
.nav button.on{color:var(--navy)}
.nav button.on::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 4px 4px;background:var(--navy)}
.badge{position:absolute;top:4px;margin-inline-start:22px;background:var(--error);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.px{padding-inline:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:600;font-size:15px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(34,58,94,.22)}
.btn.o{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.s{background:rgba(208,225,242,.7);color:var(--navy)}
.btn.d{background:#fff;border:1px solid var(--line);color:var(--error)}
.btn[disabled]{opacity:.45;pointer-events:none}
.inp{width:100%;height:50px;border:1px solid var(--line);border-radius:16px;padding:0 16px;font-size:15px;background:#fff;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(208,225,242,.6)}
label.l{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.err{color:var(--error);font-size:12.5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-inline:20px}
.row::-webkit-scrollbar{display:none}
.st{display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px;margin:24px 0 12px}
.st h2{font-size:16px;margin:0;font-weight:600}.st button{font-size:13px;color:var(--medium);font-weight:500}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding-inline:16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:11px;font-weight:500;line-height:1.3}
.cat i{width:56px;height:56px;border-radius:19px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--deep);box-shadow:0 1px 3px rgba(34,58,94,.06);font-style:normal}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-en);font-size:16px;flex:none;letter-spacing:.04em}
.pc{display:flex;gap:12px;padding:14px;text-align:start;width:100%}
.pc h3{margin:0;font-size:15px}.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:9px;font-size:12.5px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.tagd{border:1px solid rgba(230,162,60,.4);background:rgba(230,162,60,.1);color:#9A6514;font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;flex:none;height:max-content}
.b{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600}
.b.blue{background:rgba(208,225,242,.8);color:var(--deep)}.b.ok{background:rgba(39,150,107,.1);color:var(--success)}.b.mut{background:#EEF3F8;color:var(--muted)}.b.nv{background:var(--navy);color:#fff}.b.er{background:rgba(217,83,79,.1);color:var(--error)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:16px;padding:12px 0;text-align:center;margin-top:14px}
.stats div+div{border-inline-start:1px solid var(--line)}
.stats small{display:block;font-size:11px;color:var(--muted)}.stats b{display:block;font-size:19px;margin-top:4px}
.ticket{border-radius:26px;overflow:hidden;background:#fff;box-shadow:var(--shadow);border:1px solid var(--line)}
.ttop{background:linear-gradient(135deg,#223A5E,#2B4A75,#355982);color:#fff;padding:20px 20px 24px}
.ttop .big{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.01em}
.perf{position:relative;height:0}.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.perf::before{inset-inline-start:-12px}.perf::after{inset-inline-end:-12px}
.tb{padding:20px}
.box{background:var(--bg);border-radius:16px;padding:14px}
.box small{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted)}.box b{display:block;font-size:26px;margin-top:4px;line-height:1}
.bar{height:10px;background:rgba(208,225,242,.7);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--navy));transition:width .7s}
[dir=rtl] .bar i{background:linear-gradient(270deg,var(--accent),var(--navy))}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--pale)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(39,150,107,.6);animation:pl 1.6s infinite}
@keyframes pl{to{box-shadow:0 0 0 8px rgba(39,150,107,0)}}
.called{background:var(--success);color:#fff;border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(39,150,107,.3);animation:pop .5s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.sheetbg{position:absolute;inset:0;background:rgba(34,58,94,.4);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:20px;animation:up .3s;max-height:90%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{margin:0 0 8px;font-size:18px}
.toast{position:absolute;top:12px;inset-inline:16px;z-index:60;background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;font-size:13.5px;font-weight:500;box-shadow:var(--float);animation:up2 .3s}
.toast.e{background:var(--error)}
@keyframes up2{from{transform:translateY(-10px);opacity:0}}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.35em;text-align:center;font-size:20px;direction:ltr}
.hint{display:flex;gap:10px;align-items:center;background:var(--warnbg);border:1px solid rgba(230,162,60,.3);color:var(--warnfg);border-radius:16px;padding:10px 12px;font-size:12.5px}
.hint button{background:#fff;border-radius:10px;padding:6px 12px;font-weight:600;color:var(--navy);box-shadow:0 1px 3px rgba(34,58,94,.08)}
.otp{display:flex;gap:8px;direction:ltr}.otp input{width:100%;height:56px;border:1px solid var(--line);border-radius:16px;text-align:center;font-size:22px;font-weight:600;outline:none}
.otp input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(208,225,242,.6)}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:start;font-size:14.5px}
.li .ic{width:36px;height:36px;border-radius:12px;background:rgba(208,225,242,.55);display:grid;place-items:center;color:var(--deep);flex:none}
.empty{text-align:center;padding:56px 24px}
.empty .ic{width:80px;height:80px;border-radius:28px;background:linear-gradient(135deg,var(--pale),var(--bg));display:grid;place-items:center;margin:0 auto 18px;color:var(--deep)}
.stars button{font-size:30px;color:#E1EAF3;padding:2px}.stars button.on{color:var(--warning)}
.splash{flex:1;background:linear-gradient(180deg,#223A5E,#294770,#355982);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:760px}
.splash .mk{width:128px;height:128px;border-radius:36px;background:#fff;display:grid;place-items:center;animation:pop .6s;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.seg{display:flex;background:#E8EFF7;border-radius:16px;padding:4px}.seg button{flex:1;border-radius:12px;padding:9px;font-size:13px;font-weight:600;color:var(--muted)}.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(34,58,94,.08)}
.tv{background:linear-gradient(135deg,#16294A,#223A5E,#355982);color:#fff;border-radius:28px;padding:22px;box-shadow:var(--float)}
.tvg{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
.tvw{background:#fff;color:var(--navy);border-radius:22px;padding:18px}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:start;padding:10px 12px;background:rgba(243,248,253,.7);font-weight:600}.table td{padding:10px 12px;border-top:1px solid var(--line)}
.sbtn{height:34px;border-radius:10px;padding:0 12px;font-size:12.5px;font-weight:600}
@media (max-width:900px){.hero .wide{grid-template-columns:1fr;padding-block:40px}.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.links{grid-template-columns:repeat(2,minmax(0,1fr))}.tvg{grid-template-columns:1fr}.hero h1{font-size:36px}}
@media (max-width:520px){.g4,.g3,.g5{grid-template-columns:1fr}.stage{padding-block:0}.phone{border-radius:0;border:0;min-height:100vh}.hero-phone{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>

function render() {

  <label class="l" for="ac" style="margin-top:14px">${T("أدخل الرمز","Enter code")}</label><input id="ac" class="inp code" maxlength="6" placeholder="••••••" autocapitalize="characters">${UI.err?`<div class="err">${UI.err}</div>`:""}<button class="btn p" style="margin-top:14px" data-doarrive>${T("تأكيد","Confirm")}</button><button class="btn" style="margin-top:6px" data-closesheet>${T("إلغاء","Cancel")}</button></div></div>`;
  if (UI.sheet === "postpone") return `<div class="sheetbg" data-closesheet><div class="sheet" data-stop style="text-align:center"><div style="width:56px;height:56px;border-radius:50%;background:rgba(208,225,242,.7);color:var(--deep);display:grid;place-items:center;margin:0 auto 14px">${I("timer",26)}</div><h3>${T("تأجيل دورك؟","Postpone your turn?")}</h3><p class="muted" style="line-height:1.7">${T("ستتأخر 3 مراكز في الطابور. يمكنك التأجيل مرة واحدة فقط ولا تتقدم على أحد.","You'll move back 3 places. You can postpone only once and never jump ahead.")}</p><button class="btn p" data-dopostpone>${T("نعم، أجّل","Yes, postpone")}</button><button class="btn" style="margin-top:6px" data-closesheet>${T("إلغاء","Cancel")}</button></div></div>`;
  if (UI.sheet === "cancel") return `<div class="sheetbg" data-closesheet><div class="sheet" data-stop style="text-align:center"><div style="width:56px;height:56px;border-radius:50%;background:rgba(217,83,79,.1);color:var(--error);display:grid;place-items:center;margin:0 auto 14px">${I("ban",26)}</div><h3>${T("إلغاء الحجز؟","Cancel your queue?")}</h3><p class="muted" style="line-height:1.7">${T(`سيتم تحرير التذكرة ${t.number} وستفقد مكانك في الطابور.`,`Ticket ${t.number} will be released and you'll lose your place.`)}</p><button class="btn" style="background:var(--error);color:#fff" data-docancel>${T("نعم، ألغِ التذكرة","Yes, cancel ticket")}</button><button class="btn" style="margin-top:6px" data-closesheet>${T("الاحتفاظ بالتذكرة","Keep my ticket")}</button></div></div>`;
  return "";
}

// ───────── events ─────────
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { UI.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
  if (/^o\d$/.test(e.target.id)) { const v = e.target.value.replace(/\D/g, ""); const i = +e.target.id[1]; if (v.length > 1) { v.slice(0,6).split("").forEach((d,k)=>{ const el=$("#o"+k); if(el) el.value=d; }); } else { e.target.value = v; if (v && i < 5) $("#o" + (i + 1)).focus(); } }
  if (e.target.id === "ac") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("button,a"); if (!el) { return; }
  const d = el.dataset;
  if (d.stop !== undefined && !el.matches("button")) return;
  if (d.go !== undefined) { e.preventDefault(); if (d.go === "explore") { /* keep filters */ } go(d.go); return; }
  if (d.back !== undefined) { history.length > 1 ? history.back() : go("home"); return; }
  if (d.scroll !== undefined) { e.preventDefault(); $("#all")?.scrollIntoView({ behavior: "smooth" }); return; }
  if (d.lang !== undefined) { S.lang = S.lang === "ar" ? "en" : "ar"; persist(); render(); return; }
  if (d.setlang) { S.lang = d.setlang; persist(); render(); return; }
  if (d.onbnext !== undefined) { if (UI.onb < 2) { UI.onb++; render(); } else { S.onb = true; persist(); go(S.user ? "home" : "login"); } return; }
  if (d.onbdone !== undefined) { S.onb = true; persist(); go(S.user ? "home" : "login"); return; }
  if (d.sendotp !== undefined) { const n = $("#nm").value.trim(), ph = $("#ph").value.replace(/\D/g, ""); if (n.length < 2) { UI.err = T("يرجى إدخال اسمك.","Please enter your name."); render(); return; } if (!/^[4569]\d{7}$/.test(ph)) { UI.err = T("أدخل رقم هاتف كويتي صحيح (8 أرقام).","Enter a valid Kuwaiti mobile (8 digits)."); render(); $("#nm").value = n; return; } UI.name = n; UI.phone = ph; UI.err = ""; go("otp"); return; }
  if (d.fillotp !== undefined) { "123456".split("").forEach((c,k)=>$("#o"+k).value=c); return; }
  if (d.verify !== undefined) { const code = [0,1,2,3,4,5].map(k=>$("#o"+k).value).join(""); if (code !== "123456") { UI.err = T("الرمز غير صحيح. حاول مرة أخرى.","That code is incorrect."); render(); return; } S.user = { name: UI.name, phone: UI.phone }; S.onb = true; persist(); toast(T("تم تسجيل الدخول","Signed in")); go(UI.after || "home"); UI.after = null; return; }
  if (d.cat !== undefined) { UI.cat = d.cat || null; if (UI.route !== "explore") go("explore"); else render(); return; }
  if (d.sort) { UI.sort = d.sort; if (UI.route !== "explore") go("explore"); else render(); return; }
  if (d.clear !== undefined) { UI.q = ""; UI.cat = null; render(); return; }
  if (d.fav) { if (!S.user) { UI.after = "place-" + d.fav; go("login"); return; } const i = S.favs.indexOf(d.fav); i >= 0 ? S.favs.splice(i, 1) : S.favs.push(d.fav); persist(); toast(i >= 0 ? T("أزيل من المفضلة","Removed from favorites") : T("أضيف للمفضلة","Saved to favorites")); return; }
  if (d.slot) { UI.slot = +d.slot; render(); return; }
  if (d.confirm) { if (!S.user) { UI.after = "book-" + d.confirm; go("login"); return; } const [pid, sid] = d.confirm.split("-"); if (book(pid, sid)) { UI.slot = null; go("success"); } return; }
  if (d.rebook) { go("services-" + d.rebook); return; }
  if (d.sheet) { UI.sheet = d.sheet; UI.err = ""; render(); return; }
  if (d.closesheet !== undefined && (el.matches("button") )) { UI.sheet = null; render(); return; }
  if (d.usecode !== undefined) { $("#ac").value = checkCode(); return; }
  if (d.doarrive !== undefined) { const c = $("#ac").value.trim(); if (c !== checkCode()) { UI.err = T("الرمز غير صحيح. تحقق من شاشة الفرع.","That code isn't valid. Check the branch screen."); render(); $("#ac").value = c; return; } S.ticket.arrived = true; if (S.ticket.status === "WAITING") S.ticket.status = "ARRIVED"; persist(); UI.sheet = null; toast(T("تم تأكيد وصولك. يرجى الانتظار حتى يتم استدعاؤك.","Arrival confirmed. Please wait to be called.")); render(); return; }
  if (d.dopostpone !== undefined) { const t = S.ticket; t.ahead += 3; t.start += 3; t.postponed = true; if (t.status === "CALLED") t.status = t.arrived ? "ARRIVED" : "WAITING"; t.notified = []; notify("POST", t); persist(); UI.sheet = null; toast(T("تم تأجيل دورك.","Your turn was postponed.")); render(); return; }
  if (d.docancel !== undefined) { S.ticket.status = "CANCELLED"; notify("CANCEL", S.ticket); S.history.unshift({ ...S.ticket }); persist(); UI.sheet = null; toast(T("تم إلغاء حجزك.","Your booking has been cancelled.")); render(); return; }
  if (d.star) { const [k, v] = d.star.split("-").map(Number); UI.stars[k] = v; render(); return; }
  if (d.submitrev !== undefined) { S.reviews[S.ticket.at] = { s: [...UI.stars], text: $("#rv").value.slice(0, 1000) }; UI.stars = [0,0,0]; persist(); toast(T("شكراً لك! تقييمك يساعد الآخرين.","Thank you! Your review helps others.")); go("ticket"); return; }
  if (d.logout !== undefined) { S.user = null; persist(); go("login"); return; }
  if (d.reset !== undefined) { try { localStorage.removeItem("masar.live.v1"); } catch (x) {} Object.assign(S, { onb: false, user: null, ticket: null, notifs: [], history: [], favs: [], reviews: {} }); persist(); go("tour"); return; }
  if (d.fs !== undefined) { document.documentElement.requestFullscreen?.().catch(() => {}); return; }
});
document.addEventListener("click", (e) => { if (e.target.classList && e.target.classList.contains("sheetbg")) { UI.sheet = null; render(); } }, true);

parse(); render();
})();
</script>
